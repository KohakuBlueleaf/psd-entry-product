name = "matrix"
defaultTargets = ["Statement", "MatrixIneq", "Exploration"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "Statement"

# The proof of `Statement.MainTheorem`.
[[lean_lib]]
name = "MatrixIneq"

# Intermediate directions; not used by the proof.
[[lean_lib]]
name = "Exploration"

# Inputs for the comparator tool (`Challenge` contains a `sorry` by design).
[[lean_lib]]
name = "Comparator"
roots = ["Comparator.Challenge", "Comparator.Solution"]
